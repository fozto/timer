<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penghitung Tugas</title>
<style>
:root{--bg:#eef2f9;--panel:#fff;--ink:#0b1b3a;--muted:#5c6b8a;--line:#d6deee;--accent:#1d4ed8;--accent2:#38bdf8;--on:#fff;--glow:rgba(29,78,216,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070f24;--panel:#0d1a3a;--ink:#e8eeff;--muted:#8a9bc4;--line:#1c2d59;--accent:#5b8cff;--accent2:#7dd3fc;--on:#06112b;--glow:rgba(91,140,255,.28);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070f24;--panel:#0d1a3a;--ink:#e8eeff;--muted:#8a9bc4;--line:#1c2d59;--accent:#5b8cff;--accent2:#7dd3fc;--on:#06112b;--glow:rgba(91,140,255,.28);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% -10%,var(--glow),transparent 60%),var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5;overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(18px,5vw,48px) clamp(16px,4vw,32px);display:grid;gap:clamp(22px,5vw,48px);grid-template-columns:1fr;align-items:start}
@media (min-width:820px){.wrap{grid-template-columns:minmax(300px,420px) 1fr;min-height:100vh;align-items:center}}
h1{margin:0 0 4px;font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:.02em}

/* jam */
.dial{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:0 auto}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.track{fill:none;stroke:var(--line);stroke-width:3}
.prog{fill:none;stroke:url(#g);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%}
.time{font-size:clamp(1.9rem,10.5vw,3.1rem);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.1}
.lap{margin-top:8px;font-size:.85rem;color:var(--muted)}
.lap b{color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
.dial.run::after{content:"";position:absolute;inset:6%;border-radius:50%;border:1px solid var(--accent);opacity:0;animation:ping 2.4s ease-out infinite;pointer-events:none}
@keyframes ping{0%{transform:scale(.96);opacity:.5}100%{transform:scale(1.14);opacity:0}}
.dial.flash .prog{animation:flash .7s ease}
@keyframes flash{50%{stroke-width:9}}

.ctrl{display:flex;gap:10px;justify-content:center;margin-top:22px}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 22px;min-height:46px;font-weight:500}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
button.main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);border:0;font-weight:600;min-width:130px}
button.main:hover{box-shadow:0 6px 22px var(--glow)}

/* panel kanan */
.side{min-width:0}
form{display:flex;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;transition:border-color .2s}
form:focus-within{border-color:var(--accent2)}
input{flex:1;min-width:0;font:inherit;font-size:1.05rem;background:transparent;border:0;color:var(--ink);padding:10px 2px}
input:focus-visible{outline:0}
input::placeholder{color:var(--muted)}
form button{min-height:40px;padding:8px 18px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 6px}
.head h2{margin:0;font-size:.95rem;font-weight:500;color:var(--muted)}
.head button{padding:4px 12px;min-height:30px;font-size:.8rem;color:var(--muted)}
ul{list-style:none;margin:0;padding:0 6px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:16px;max-height:360px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
li.empty{display:block;grid-column:1/-1;height:auto}
li{display:grid;grid-template-areas:"ic x" "nm nm" "du du";grid-template-columns:minmax(0,1fr) 30px;grid-template-rows:40px auto auto;row-gap:4px;align-items:center;height:120px;padding:12px 4px;border-bottom:1px solid var(--line)}
li .ic{grid-area:ic;justify-self:start}li .nm{grid-area:nm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}li .dur{grid-area:du}li .x{grid-area:x;justify-self:end;align-self:start}
li .nm{flex:1;min-width:0;overflow-wrap:anywhere}
li .dur{font-variant-numeric:tabular-nums;color:var(--accent2);font-weight:600;white-space:nowrap;font-size:.95rem}
li .x{min-height:30px;width:30px;padding:0;border:0;color:var(--muted);opacity:.55}
li .x:hover{opacity:1;color:var(--ink)}
li.new{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{color:var(--muted);padding:22px 4px;font-size:.95rem}
.wrap{position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.stats div{border-left:2px solid var(--accent2);padding-left:12px;min-width:0}
.stats b{display:block;font-size:clamp(1.05rem,4vw,1.5rem);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.stats span{font-size:.78rem;color:var(--muted)}
.stats b.bump{animation:bump .45s}
@keyframes bump{50%{transform:translateY(-5px);color:var(--accent2)}}
.chart{margin-top:28px}
.ch-title{font-size:.95rem;color:var(--muted);margin:0 0 12px;font-weight:500}
.plot{position:relative;height:120px;border-bottom:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:4px;height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.bar{flex:1 1 0;min-width:6px;max-width:44px;height:0;border-radius:6px 6px 0 0;background:var(--accent);opacity:.5;transition:height .6s cubic-bezier(.2,.8,.2,1),opacity .2s}
.bar:hover{opacity:.9}
.bar.max{background:linear-gradient(var(--accent2),var(--accent));opacity:1}
.avg{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);pointer-events:none;display:none}
.cap{margin-top:8px;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.22;pointer-events:none;z-index:0}
.o1{width:340px;height:340px;background:var(--accent);top:-80px;left:-60px;animation:drift 18s ease-in-out infinite alternate}
.o2{width:300px;height:300px;background:var(--accent2);bottom:-100px;right:-60px;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
.tip{fill:var(--accent2);filter:drop-shadow(0 0 5px var(--accent2))}
.ic{flex:none;width:40px;height:40px;min-height:40px;padding:0;border:0;border-radius:12px;display:grid;place-items:center;background:var(--glow);color:var(--accent2);transition:transform .2s}
.ic:hover{transform:rotate(-8deg) scale(1.1);box-shadow:0 4px 14px var(--glow)}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic svg *{stroke-dasharray:1;stroke-dashoffset:0}
li.new .ic{animation:pop .65s cubic-bezier(.3,1.6,.5,1)}
li.new .ic svg *{animation:draw .8s .15s ease both}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sp{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--c);pointer-events:none;animation:burst .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
@media (max-width:1000px){ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px) and (min-width:641px){ul{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:340px){ul{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="wrap">
  <section aria-label="Penghitung waktu">
    
    <div class="dial" id="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="92"/>
        <circle class="prog" id="prog" cx="100" cy="100" r="92" stroke-dasharray="578.05" stroke-dashoffset="578.05"/>
        <circle class="tip" id="tip" cx="192" cy="100" r="5" style="opacity:0"/>
      </svg>
      <div class="in">
        <div class="time" id="time" role="timer">00:00:00</div>
        <div class="lap">tugas ini <b id="lap">0 detik</b></div>
      </div>
    </div>
    <div class="ctrl">
      <button class="main" id="toggle" type="button">Mulai</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </section>

  <section class="side" aria-label="Daftar tugas">
    <form id="form" autocomplete="off">
      <input id="name" placeholder="Selesai mengerjakan apa?" maxlength="80" aria-label="Nama tugas">
      <button class="main" type="submit" style="min-width:0">Selesai</button>
    </form>
    <div class="stats" aria-label="Laporan">
      <div><b id="sCount">0</b><span>tugas selesai</span></div>
      <div><b id="sTotal">0 detik</b><span>total waktu</span></div>
      <div><b id="sAvg">0 detik</b><span>rata-rata per tugas</span></div>
    </div>
    <div class="chart" id="chart" hidden>
      <h2 class="ch-title">Durasi per tugas</h2>
      <div class="plot"><div class="bars" id="bars"></div><div class="avg" id="avg"></div></div>
      <div class="cap" id="cap"></div>
    </div>
    <div class="head"><h2 id="count">Tugas selesai</h2><button type="button" id="clear">Hapus semua</button></div>
    <ul id="list" aria-live="polite"></ul>
  </section>
</div>

<script>
(function(){
  var C = 578.05, elapsed = 0, startAt = 0, running = false, lastMark = 0, raf = 0, tasks = [], newest = -1;
  var $ = function(id){return document.getElementById(id)};
  function now(){ return running ? elapsed + (Date.now() - startAt) : elapsed; }
  function pad(n){ return (n<10?'0':'')+n; }
  var P = ' pathLength="1"';
  var ICONS = [
    {r:/$^/, d:'<path'+P+' d="M5 12.5l4.5 4.5L19 7.5"/>'},
    {r:/identifik|cari|riset|survei|analis|periksa|selidik/, d:'<circle'+P+' cx="11" cy="11" r="6"/><path'+P+' d="M20 20l-4.5-4.5"/>'},
    {r:/tulis|lapor|catat|dokumen|draft|artikel|ketik|esai|essay|makalah/, d:'<path'+P+' d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19z"/><path'+P+' d="M14 7l3 3"/>'},
    {r:/kode|coding|program|debug|web|aplikasi|script|develop/, d:'<path'+P+' d="M8 8l-4 4 4 4"/><path'+P+' d="M16 8l4 4-4 4"/><path'+P+' d="M13.5 5l-3 14"/>'},
    {r:/baca|belajar|materi|kuliah|buku|kursus/, d:'<path'+P+' d="M4 5.5C6 4.5 9 4.5 12 6c3-1.5 6-1.5 8-.5V19c-2-1-5-1-8 .5-3-1.5-6-1.5-8-.5z"/><path'+P+' d="M12 6v13.5"/>'},
    {r:/rapat|meeting|diskus|telepon|telpon|call|presentasi|konsul/, d:'<path'+P+' d="M5 5h14v10H10l-4 4v-4H5z"/>'},
    {r:/olahraga|lari|gym|workout|senam|renang|sepeda/, d:'<path'+P+' d="M3 12h18"/><path'+P+' d="M6 8v8"/><path'+P+' d="M9 6v12"/><path'+P+' d="M15 6v12"/><path'+P+' d="M18 8v8"/>'},
    {r:/makan|masak|minum|kopi|sarapan|sahur/, d:'<path'+P+' d="M5 9h11v5a4 4 0 01-4 4H9a4 4 0 01-4-4z"/><path'+P+' d="M16 10h2a2 2 0 010 4h-2"/><path'+P+' d="M8 4v2"/><path'+P+' d="M12 4v2"/>'},
    {r:/bersih|cuci|rapi|sapu|pel|beres|laundry/, d:'<path'+P+' d="M12 4l1.8 5.2L19 11l-5.2 1.8L12 18l-1.8-5.2L5 11l5.2-1.8z"/>'},
    {r:/desain|design|gambar|foto|edit|ilustrasi|logo|video/, d:'<rect'+P+' x="4" y="5" width="16" height="14" rx="2"/><circle'+P+' cx="9" cy="10" r="1.5"/><path'+P+' d="M4 17l5-4 4 3 3-2 4 3"/>'},
    {r:/email|e-mail|surat|kirim|balas|pesan|chat/, d:'<rect'+P+' x="3.5" y="6" width="17" height="12" rx="2"/><path'+P+' d="M4 8l8 6 8-6"/>'},
    {r:/beli|belanja|bayar|pasar|order|tagihan/, d:'<path'+P+' d="M6 8h12l1 12H5z"/><path'+P+' d="M9 8V6a3 3 0 016 0v2"/>'}
  ];
  function pick(n){ n = n.toLowerCase(); for(var i=1;i<ICONS.length;i++){ if(ICONS[i].r.test(n)) return i; } return 0; }
  function burst(){
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var d = $('dial'), cols = ['var(--accent)','var(--accent2)','var(--ink)'];
    for(var i=0;i<22;i++){
      var s = document.createElement('i'), a = Math.random()*6.283, r = 110 + Math.random()*90;
      s.className = 'sp';
      s.style.setProperty('--dx', Math.cos(a)*r + 'px'); s.style.setProperty('--dy', Math.sin(a)*r + 'px');
      s.style.setProperty('--c', cols[i%3]); s.style.animationDelay = (Math.random()*.08) + 's';
      d.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 1100); })(s);
    }
  }
  function words(ms){
    var s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), d = s%60, o = [];
    if(h) o.push(h+' jam'); if(m) o.push(m+' menit'); if(d || !o.length) o.push(d+' detik');
    return o.join(' ');
  }
  function render(){
    var t = now(), s = Math.floor(t/1000);
    $('time').textContent = pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
    $('lap').textContent = words(t - lastMark);
    var f = (t % 60000) / 60000;
    $('prog').style.strokeDashoffset = C * (1 - f);
    var tip = $('tip'); tip.setAttribute('transform', 'rotate(' + (f*360) + ' 100 100)'); tip.style.opacity = t > 0 ? 1 : 0;
  }
  function loop(){ render(); if(running) raf = requestAnimationFrame(loop); }

  function start(){
    running = true; startAt = Date.now();
    $('dial').classList.add('run'); $('toggle').textContent = 'Jeda';
    cancelAnimationFrame(raf); loop();
  }
  function pause(){
    elapsed += Date.now() - startAt; running = false;
    cancelAnimationFrame(raf); $('dial').classList.remove('run');
    $('toggle').textContent = 'Lanjut'; render();
  }
  $('toggle').onclick = function(){ running ? pause() : start(); };
  $('reset').onclick = function(){
    if(tasks.length && !confirm('Reset waktu? Daftar tugas tetap ada.')) return;
    cancelAnimationFrame(raf); running = false; elapsed = 0; lastMark = 0;
    $('dial').classList.remove('run'); $('toggle').textContent = 'Mulai'; render();
  };

  $('form').onsubmit = function(e){
    e.preventDefault();
    var nm = $('name').value.trim();
    if(!nm){ $('name').focus(); return; }
    if(!running && elapsed === 0) start();
    var t = now();
    tasks.push({name:nm, ms:t - lastMark, icon:pick(nm)}); newest = tasks.length - 1; lastMark = t;
    burst();
    $('name').value = ''; $('name').focus();
    var d = $('dial'); d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash');
    draw(); render();
  };

  function chart(){
    var box = $('chart'), bars = $('bars');
    box.hidden = !tasks.length;
    while(bars.children.length > tasks.length) bars.removeChild(bars.lastChild);
    while(bars.children.length < tasks.length){
      var nb = document.createElement('i'); nb.className = 'bar'; bars.appendChild(nb);
    }
    if(!tasks.length) return;
    void bars.offsetHeight;
    var max = 0, tot = 0, mi = 0;
    tasks.forEach(function(k, i){ tot += k.ms; if(k.ms > max){ max = k.ms; mi = i; } });
    tasks.forEach(function(k, i){
      var b = bars.children[i];
      b.title = k.name + ' · ' + words(k.ms);
      b.classList.toggle('max', i === mi);
      b.style.height = Math.max(4, max ? k.ms / max * 100 : 0) + '%';
    });
    var av = $('avg');
    av.style.display = tasks.length > 1 ? 'block' : 'none';
    av.style.bottom = (max ? tot / tasks.length / max * 100 : 0) + '%';
    $('cap').textContent = 'Terlama: ' + tasks[mi].name + ' · ' + words(max) + (tasks.length > 1 ? ' · garis putus-putus = rata-rata' : '');
  }
  function draw(){
    var ul = $('list'); ul.innerHTML = '';
    $('count').textContent = tasks.length ? 'Tugas selesai · ' + tasks.length : 'Tugas selesai';
    var tot = 0; tasks.forEach(function(k){ tot += k.ms; });
    var sc = $('sCount'), old = sc.textContent;
    sc.textContent = tasks.length;
    $('sTotal').textContent = words(tot);
    $('sAvg').textContent = tasks.length ? words(tot / tasks.length) : '0 detik';
    if(old !== String(tasks.length)){ sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
    chart();
    if(!tasks.length){
      var e = document.createElement('li'); e.className = 'empty';
      e.textContent = 'Belum ada tugas. Ketik namanya lalu tekan Selesai.';
      ul.appendChild(e); return;
    }
    for(var i = 0; i < tasks.length; i++){ (function(i){
      var k = tasks[i], li = document.createElement('li');
      if(i === newest) li.className = 'new';
      var ic = document.createElement('button'); ic.type = 'button'; ic.className = 'ic'; ic.title = 'Ganti ikon';
      ic.setAttribute('aria-label','Ganti ikon ' + k.name);
      ic.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[k.icon].d + '</svg>';
      ic.onclick = function(){ k.icon = (k.icon + 1) % ICONS.length; newest = -1; draw(); };
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = k.name; nm.title = k.name;
      var du = document.createElement('span'); du.className = 'dur'; du.textContent = words(k.ms);
      var x = document.createElement('button'); x.className = 'x'; x.type = 'button';
      x.textContent = '✕'; x.setAttribute('aria-label','Hapus ' + k.name);
      x.onclick = function(){ tasks.splice(i,1); newest = -1; draw(); };
      li.appendChild(ic); li.appendChild(nm); li.appendChild(du); li.appendChild(x); ul.appendChild(li);
    })(i); }
    if(newest >= 0) ul.scrollTop = ul.scrollHeight;
  }
  $('clear').onclick = function(){
    if(tasks.length && confirm('Hapus semua daftar tugas?')){ tasks = []; draw(); }
  };
  draw(); render();
})();
</script>
</body>
</html>
